[project]
name = "sauri-store"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "saury-backend",
    "shared",
]

[tool.uv.sources]
saury-backend = { workspace = true }
shared = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/saury-backend",
    "packages/python/shared",
]

[tool.pytest.ini_options]
testpaths = ["apps/saury-backend/tests", "packages/python/shared/tests"]
pythonpath = ["apps/saury-backend/tests"]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
