[project]
name = "saury-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Eduardo Marcelo Mazzola Fernádez", email = "eduardo.mmf@avangenio.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anyio>=4.15.1",
    "asyncpg>=0.31.0",
    "cloudinary>=1.46.2",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "shared",
    "sqlalchemy[asyncio]>=2.0.53",
    "uvicorn>=0.53.0",
]

[project.scripts]
saury-backend = "saury_backend.main:main"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared = { workspace = true }
