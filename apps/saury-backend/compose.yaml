name: sauri-store

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sauri
      POSTGRES_PASSWORD: sauri
      POSTGRES_DB: sauri_store_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sauri -d sauri_store_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
